[code]
globs = ["tictactoe/domain/board.py", "tictactoe/domain/tournament.py", "tictactoe/ui/cli.py", "tictactoe/ui/gui.py"]

[tests]
globs = ["tests/*.py"]

[test]
cmd = "pytest -q --junitxml={report} -k '{filter}'"
report = "junit.xml"

[policy]
tdd = "strict"

[agents]
hosts = ["claude", "codex"]
